# actions/labeler v5 configuration. Labels a pull request by the paths it touches.
# Every label named here must also exist in .github/labels.yml; the sync-labels job
# in the labeler workflow creates the missing ones before this runs.

web:
  - changed-files:
      - any-glob-to-any-file: 'apps/web/**'

api:
  - changed-files:
      - any-glob-to-any-file: 'apps/api/**'

shared:
  - changed-files:
      - any-glob-to-any-file: 'packages/shared/**'

interpreter:
  - changed-files:
      - any-glob-to-any-file:
          - 'packages/shared/src/blocks/**'
          - 'apps/api/test/interpreter.spec.ts'

curriculum:
  - changed-files:
      - any-glob-to-any-file: 'packages/shared/src/data/**'

database:
  - changed-files:
      - any-glob-to-any-file:
          - 'apps/api/src/db/**'
          - 'apps/api/drizzle.config.ts'
          - 'docker-compose.yml'

security:
  - changed-files:
      - any-glob-to-any-file:
          - 'apps/api/src/auth/**'
          - 'apps/api/src/common/masking.ts'
          - 'apps/api/src/common/roles.guard.ts'
          - 'apps/api/src/common/audit.service.ts'

tests:
  - changed-files:
      - any-glob-to-any-file:
          - '**/*.spec.ts'
          - '**/*.test.ts'
          - 'apps/api/vitest.config.ts'

docs:
  - changed-files:
      - any-glob-to-any-file:
          - 'docs/**'
          - '**/*.md'
          - 'LICENSE'
          - 'NOTICE'

i18n:
  - changed-files:
      - any-glob-to-any-file: 'docs/*.ko.md'

ci:
  - changed-files:
      - any-glob-to-any-file: '.github/**'

docker:
  - changed-files:
      - any-glob-to-any-file:
          - '**/Dockerfile'
          - '.dockerignore'
          - 'docker/**'
          - 'apps/web/nginx.conf.template'

tooling:
  - changed-files:
      - any-glob-to-any-file:
          - '.husky/**'
          - '.oxlintrc.json'
          - '.oxfmtrc.json'
          - '.editorconfig'
          - 'package.json'
          - 'pnpm-workspace.yaml'

dependencies:
  - changed-files:
      - any-glob-to-any-file:
          - 'pnpm-lock.yaml'
          - '**/package.json'
