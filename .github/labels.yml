# The single source of truth for the labels this repository uses.
# The labeler workflow reads this on every pull request, creates the labels that do
# not exist yet and aligns their colour and description.
# A label created by hand that is not listed here is left alone, never deleted.

- name: web
  color: '38bdf8'
  description: apps/web - the React SPA
- name: api
  color: '22c55e'
  description: apps/api - the NestJS server
- name: shared
  color: 'a78bfa'
  description: packages/shared - types, data and the interpreter
- name: interpreter
  color: '7c3aed'
  description: Block interpreter. Grading depends on it, so tests are required
- name: curriculum
  color: 'f59e0b'
  description: Curriculum content - achievement standards and missions
- name: database
  color: '0ea5e9'
  description: Schema, migrations and seed data
- name: security
  color: 'dc2626'
  description: Auth, permissions, masking and the audit log
- name: tests
  color: '84cc16'
  description: Test code and configuration
- name: docs
  color: '0891b2'
  description: Documentation
- name: i18n
  color: '06b6d4'
  description: Documentation translations (docs/*.ko.md)
- name: ci
  color: '64748b'
  description: GitHub Actions and repository configuration
- name: docker
  color: '2496ed'
  description: Dockerfiles, compose files and image builds
- name: tooling
  color: '94a3b8'
  description: Linter, formatter, hooks and workspace configuration
- name: dependencies
  color: 'cbd5e1'
  description: Dependency changes
