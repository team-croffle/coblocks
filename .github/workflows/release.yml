name: Release

# 기본은 수동 배포다. Actions 탭에서 Run workflow.
# 자동화(Claude 포함)는 repository_dispatch 로 같은 입력을 넘긴다:
#   gh api repos/team-croffle/coblocks/dispatches -f event_type=release \
#     -F 'client_payload[release_type]=rc' -F 'client_payload[draft]=true'
# 어느 경로로 들어오든 릴리스는 draft 에서 멈춘다. 공개는 사람이 누른다.
on:
  workflow_dispatch:
    inputs:
      release_type:
        description: 'version 을 직접 넣으면 무시된다'
        required: true
        type: choice
        options: [patch, minor, major, rc]
        default: rc
      version:
        description: 'v 없는 정확한 버전 (예: 0.1.0). 비우면 자동 증가'
        required: false
        type: string
        default: ''
      version_suffix:
        description: '앞 하이픈 없는 프리릴리스 suffix (예: rc.1, beta.2). 비우면 없음'
        required: false
        type: string
        default: ''
      prerelease:
        description: 'auto = suffix 유무로 판단 / true = 베타 기능 포함이므로 강제 프리릴리스'
        required: true
        type: choice
        options: [auto, 'true', 'false']
        default: auto
      apps:
        description: '빌드·푸시할 이미지. 버전은 어느 쪽을 고르든 하나로 움직인다'
        required: true
        type: choice
        options: [all, api, web]
        default: all
      draft:
        description: '업로드 후에도 draft 로 둔다'
        required: true
        type: boolean
        default: true
      dry_run:
        description: '이미지 빌드만 (커밋·태그·푸시·발행 없음)'
        required: true
        type: boolean
        default: false
  repository_dispatch:
    types: [release]

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '22'
  REGISTRY: ghcr.io

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.calc.outputs.version }}
      tag: ${{ steps.calc.outputs.tag }}
      title: ${{ steps.calc.outputs.title }}
      is_prerelease: ${{ steps.calc.outputs.is_prerelease }}
      apps: ${{ steps.input.outputs.apps }}
      dry_run: ${{ steps.calc.outputs.dry_run }}
      draft: ${{ steps.calc.outputs.draft }}
      ref: ${{ steps.commit.outputs.ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # workflow_dispatch 와 repository_dispatch 의 입력을 한 곳에서 합친다.
      - name: Normalize inputs
        id: input
        shell: bash
        env:
          E: ${{ toJSON(github.event) }}
        run: |
          set -euo pipefail
          get() {
            node -e '
              const e = JSON.parse(process.env.E);
              const k = process.argv[1], d = process.argv[2];
              const v = (e.inputs && e.inputs[k]) ?? (e.client_payload && e.client_payload[k]);
              console.log(v === undefined || v === null || v === "" ? d : String(v));
            ' "$1" "$2"
          }
          {
            echo "release_type=$(get release_type rc)"
            echo "version=$(get version '')"
            echo "version_suffix=$(get version_suffix '')"
            echo "prerelease=$(get prerelease auto)"
            echo "draft=$(get draft true)"
            echo "dry_run=$(get dry_run false)"
          } >> "$GITHUB_OUTPUT"

          # 이미지 선택을 매트릭스가 바로 쓸 수 있는 JSON 배열로 바꾼다.
          case "$(get apps all)" in
            api) echo 'apps=["api"]' >> "$GITHUB_OUTPUT" ;;
            web) echo 'apps=["web"]' >> "$GITHUB_OUTPUT" ;;
            *)   echo 'apps=["api","web"]' >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Calculate version
        id: calc
        shell: bash
        env:
          RELEASE_TYPE: ${{ steps.input.outputs.release_type }}
          INPUT_VERSION: ${{ steps.input.outputs.version }}
          VERSION_SUFFIX: ${{ steps.input.outputs.version_suffix }}
          FORCE_PRE: ${{ steps.input.outputs.prerelease }}
          DRAFT: ${{ steps.input.outputs.draft }}
          DRY_RUN: ${{ steps.input.outputs.dry_run }}
        run: |
          set -euo pipefail
          CURRENT=$(node -p "require('./package.json').version")
          echo "현재 버전: $CURRENT"

          core_of() {
            node -e "const v=process.argv[1].replace(/^v/,'').split(/[-+]/)[0]; if(!/^\d+\.\d+\.\d+$/.test(v)){console.error('semver core 아님:',process.argv[1]);process.exit(1)}; console.log(v)" "$1"
          }
          bump_core() {
            node -e "
              const [maj,min,pat]=process.argv[1].split('.').map(Number);
              const k=process.argv[2];
              if(k==='major') console.log(\`\${maj+1}.0.0\`);
              else if(k==='minor') console.log(\`\${maj}.\${min+1}.0\`);
              else console.log(\`\${maj}.\${min}.\${pat+1}\`);
            " "$1" "$2"
          }

          NEXT=""
          if [[ -n "$INPUT_VERSION" ]]; then
            NEXT="${INPUT_VERSION#v}"
          else
            CORE="$(core_of "$CURRENT")"
            case "$RELEASE_TYPE" in
              major|minor|patch) NEXT="$(bump_core "$CORE" "$RELEASE_TYPE")" ;;
              # 같은 버전을 여러 브랜치로 나눠 작업할 때 병합마다 rc.N 을 올린다.
              rc)
                if [[ "$CURRENT" =~ ^([0-9]+\.[0-9]+\.[0-9]+)-rc\.([0-9]+)$ ]]; then
                  NEXT="${BASH_REMATCH[1]}-rc.$(( BASH_REMATCH[2] + 1 ))"
                else
                  NEXT="${CORE}-rc.1"
                fi
                ;;
              *) echo "알 수 없는 release_type: $RELEASE_TYPE" >&2; exit 1 ;;
            esac
          fi

          if [[ -n "$VERSION_SUFFIX" ]]; then
            NEXT="$(core_of "$NEXT")-${VERSION_SUFFIX#-}"
          fi

          if [[ ! "$NEXT" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "버전 형식이 이상하다: $NEXT" >&2; exit 1
          fi

          # suffix 가 있으면 무조건 프리릴리스. 없어도 베타 기능이 섞였으면 강제로 켠다.
          IS_PRE=false
          [[ "$NEXT" == *-* ]] && IS_PRE=true
          [[ "$FORCE_PRE" == "true" ]] && IS_PRE=true
          [[ "$FORCE_PRE" == "false" && "$NEXT" != *-* ]] && IS_PRE=false

          if [[ "$IS_PRE" == "true" ]]; then
            TITLE="Pre-Release v${NEXT}"
          else
            TITLE="Release v${NEXT}"
          fi

          TAG="v${NEXT}"
          echo "→ $TITLE (tag $TAG, prerelease=$IS_PRE, draft=$DRAFT, dry_run=$DRY_RUN)"

          if [[ "$DRY_RUN" != "true" ]] && git ls-remote --tags origin "refs/tags/${TAG}" | grep -q .; then
            echo "::error::태그 ${TAG} 가 이미 origin 에 있다."
            exit 1
          fi

          {
            echo "version=${NEXT}"
            echo "tag=${TAG}"
            echo "title=${TITLE}"
            echo "is_prerelease=${IS_PRE}"
            echo "draft=${DRAFT}"
            echo "dry_run=${DRY_RUN}"
          } >> "$GITHUB_OUTPUT"

      - name: Write package versions
        if: steps.calc.outputs.dry_run != 'true'
        shell: bash
        env:
          NEW_VERSION: ${{ steps.calc.outputs.version }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const version = process.env.NEW_VERSION;
          const files = ['package.json', 'apps/api/package.json', 'apps/web/package.json', 'packages/shared/package.json'];
          for (const file of files) {
            const pkg = JSON.parse(fs.readFileSync(file, 'utf8'));
            pkg.version = version;
            fs.writeFileSync(file, JSON.stringify(pkg, null, 2) + '\n');
            console.log(`${file} → ${version}`);
          }
          NODE

      - name: Commit, tag, push
        id: commit
        shell: bash
        env:
          DRY_RUN: ${{ steps.calc.outputs.dry_run }}
          NEW_VERSION: ${{ steps.calc.outputs.version }}
          TAG: ${{ steps.calc.outputs.tag }}
        run: |
          set -euo pipefail
          if [[ "$DRY_RUN" == "true" ]]; then
            echo "dry_run — 커밋·태그·푸시 생략"
            echo "ref=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json apps/api/package.json apps/web/package.json packages/shared/package.json
          git commit -m "release: v${NEW_VERSION}"

          for attempt in 1 2 3; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then break; fi
            if [[ $attempt -eq 3 ]]; then echo "브랜치 푸시 3회 실패" >&2; exit 1; fi
            echo "푸시 거절 (시도 $attempt/3) — rebase 후 재시도"
            git pull --rebase origin "${GITHUB_REF_NAME}"
          done

          git tag "$TAG"
          git push origin "$TAG"
          echo "ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Create draft release
        if: steps.calc.outputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.calc.outputs.tag }}
          TITLE: ${{ steps.calc.outputs.title }}
          IS_PRE: ${{ steps.calc.outputs.is_prerelease }}
        run: |
          set -euo pipefail
          ARGS=(--draft --title "$TITLE" --generate-notes)
          [[ "$IS_PRE" == "true" ]] && ARGS+=(--prerelease)
          gh release create "$TAG" "${ARGS[@]}" --repo "$GITHUB_REPOSITORY"
          echo "draft 릴리스 생성: $TITLE"

  images:
    name: Image (${{ matrix.app }})
    needs: version
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 버전은 하나지만 이미지는 따로 밀 수 있다 — 한쪽만 고쳐 다시 낼 때 쓴다.
        app: ${{ fromJSON(needs.version.outputs.apps) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.ref }}

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: needs.version.outputs.dry_run != 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 정식이면 X.Y.Z / X.Y / latest, 프리릴리스면 X.Y.Z-suffix / edge
      - name: Compose tags
        id: tags
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
          IS_PRE: ${{ needs.version.outputs.is_prerelease }}
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository_owner }}/coblocks-${{ matrix.app }}
        run: |
          set -euo pipefail
          IMAGE="$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')"
          TAGS="${IMAGE}:${VERSION}"
          if [[ "$IS_PRE" == "true" ]]; then
            TAGS="${TAGS}\n${IMAGE}:edge"
          else
            MINOR="${VERSION%.*}"
            TAGS="${TAGS}\n${IMAGE}:${MINOR}\n${IMAGE}:latest"
          fi
          printf 'tags<<EOF\n%b\nEOF\n' "$TAGS" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: ${{ needs.version.outputs.dry_run != 'true' }}
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.title=coblocks-${{ matrix.app }}
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
            org.opencontainers.image.revision=${{ needs.version.outputs.ref }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  finalize:
    name: Finalize release
    needs: [version, images]
    if: ${{ !cancelled() && !failure() && needs.version.outputs.dry_run != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Keep draft or publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
          KEEP_DRAFT: ${{ needs.version.outputs.draft }}
          IS_PRE: ${{ needs.version.outputs.is_prerelease }}
        run: |
          set -euo pipefail
          sleep 5
          ARGS=()
          if [[ "$KEEP_DRAFT" == "true" ]]; then ARGS+=(--draft); else ARGS+=(--draft=false); fi
          if [[ "$IS_PRE" == "true" ]]; then ARGS+=(--prerelease); else ARGS+=(--prerelease=false); fi
          gh release edit "$TAG" "${ARGS[@]}" --repo "$GITHUB_REPOSITORY"
          echo "릴리스 $TAG 갱신 (draft=$KEEP_DRAFT, prerelease=$IS_PRE)"
