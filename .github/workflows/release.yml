name: Release

# Releases are cut by hand from the Actions tab. Automation starts one through
# repository_dispatch with the same inputs:
#   gh api repos/team-croffle/coblocks/dispatches -f event_type=release \
#     -F 'client_payload[release_type]=rc' -F 'client_payload[draft]=true'
# Either path stops at a draft release. Publishing stays a human act.
#
# One version covers both apps (see .ai/VERSIONING.md). A release candidate may
# ship only the app that changed via the `apps` input; a final release syncs both.
on:
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Ignored when an exact version is given'
        required: true
        type: choice
        options: [patch, minor, major, rc]
        default: rc
      version:
        description: 'Exact version without the leading v (e.g. 0.1.0). Empty = auto bump'
        required: false
        type: string
        default: ''
      version_suffix:
        description: 'Prerelease suffix without the leading hyphen (e.g. rc.1, beta.2). Empty = none'
        required: false
        type: string
        default: ''
      prerelease:
        description: 'auto = decided by the suffix / true = force, the version carries beta work'
        required: true
        type: choice
        options: [auto, 'true', 'false']
        default: auto
      apps:
        description: 'Images to build and push (api also builds the migration worker)'
        required: true
        type: choice
        options: [all, api, web]
        default: all
      draft:
        description: 'Keep the release as a draft after the images are pushed'
        required: true
        type: boolean
        default: true
      dry_run:
        description: 'Build images only: no commit, tag, push or release'
        required: true
        type: boolean
        default: false
  repository_dispatch:
    types: [release]

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '22'
  REGISTRY: ghcr.io

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.calc.outputs.version }}
      tag: ${{ steps.calc.outputs.tag }}
      title: ${{ steps.calc.outputs.title }}
      is_prerelease: ${{ steps.calc.outputs.is_prerelease }}
      dry_run: ${{ steps.calc.outputs.dry_run }}
      draft: ${{ steps.calc.outputs.draft }}
      apps: ${{ steps.input.outputs.apps }}
      ref: ${{ steps.commit.outputs.ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # workflow_dispatch and repository_dispatch inputs are merged here so the
      # rest of the workflow reads one set of values.
      - name: Normalize inputs
        id: input
        shell: bash
        env:
          E: ${{ toJSON(github.event) }}
        run: |
          set -euo pipefail
          get() {
            node -e '
              const e = JSON.parse(process.env.E);
              const k = process.argv[1], d = process.argv[2];
              const v = (e.inputs && e.inputs[k]) ?? (e.client_payload && e.client_payload[k]);
              console.log(v === undefined || v === null || v === "" ? d : String(v));
            ' "$1" "$2"
          }
          {
            echo "release_type=$(get release_type rc)"
            echo "version=$(get version '')"
            echo "version_suffix=$(get version_suffix '')"
            echo "prerelease=$(get prerelease auto)"
            echo "draft=$(get draft true)"
            echo "dry_run=$(get dry_run false)"
          } >> "$GITHUB_OUTPUT"

          # Turn the image selection into a JSON array the matrix can consume.
          # The migration worker is built from the api Dockerfile, so it ships
          # whenever the api does: the schema it applies is the schema that build
          # expects, and letting them drift is how a deploy breaks.
          API='{"image":"api","file":"apps/api/Dockerfile","target":"runtime"}'
          MIGRATE='{"image":"migrate","file":"apps/api/Dockerfile","target":"migrate"}'
          WEB='{"image":"web","file":"apps/web/Dockerfile","target":"runtime"}'
          case "$(get apps all)" in
            api) echo "apps=[$API,$MIGRATE]" >> "$GITHUB_OUTPUT" ;;
            web) echo "apps=[$WEB]" >> "$GITHUB_OUTPUT" ;;
            *)   echo "apps=[$API,$MIGRATE,$WEB]" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Calculate version
        id: calc
        shell: bash
        env:
          RELEASE_TYPE: ${{ steps.input.outputs.release_type }}
          INPUT_VERSION: ${{ steps.input.outputs.version }}
          VERSION_SUFFIX: ${{ steps.input.outputs.version_suffix }}
          FORCE_PRE: ${{ steps.input.outputs.prerelease }}
          DRAFT: ${{ steps.input.outputs.draft }}
          DRY_RUN: ${{ steps.input.outputs.dry_run }}
        run: |
          set -euo pipefail
          CURRENT=$(node -p "require('./package.json').version")
          echo "Current version: $CURRENT"

          core_of() {
            node -e "const v=process.argv[1].replace(/^v/,'').split(/[-+]/)[0]; if(!/^\d+\.\d+\.\d+$/.test(v)){console.error('Not a semver core:',process.argv[1]);process.exit(1)}; console.log(v)" "$1"
          }
          bump_core() {
            node -e "
              const [maj,min,pat]=process.argv[1].split('.').map(Number);
              const k=process.argv[2];
              if(k==='major') console.log(\`\${maj+1}.0.0\`);
              else if(k==='minor') console.log(\`\${maj}.\${min+1}.0\`);
              else console.log(\`\${maj}.\${min}.\${pat+1}\`);
            " "$1" "$2"
          }

          NEXT=""
          if [[ -n "$INPUT_VERSION" ]]; then
            NEXT="${INPUT_VERSION#v}"
          else
            CORE="$(core_of "$CURRENT")"
            case "$RELEASE_TYPE" in
              major|minor|patch) NEXT="$(bump_core "$CORE" "$RELEASE_TYPE")" ;;
              # One version line split across branches: each merge bumps rc.N.
              rc)
                if [[ "$CURRENT" =~ ^([0-9]+\.[0-9]+\.[0-9]+)-rc\.([0-9]+)$ ]]; then
                  NEXT="${BASH_REMATCH[1]}-rc.$(( BASH_REMATCH[2] + 1 ))"
                else
                  NEXT="${CORE}-rc.1"
                fi
                ;;
              *) echo "Unknown release_type: $RELEASE_TYPE" >&2; exit 1 ;;
            esac
          fi

          if [[ -n "$VERSION_SUFFIX" ]]; then
            NEXT="$(core_of "$NEXT")-${VERSION_SUFFIX#-}"
          fi

          if [[ ! "$NEXT" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Computed version looks wrong: $NEXT" >&2; exit 1
          fi

          # A suffix always means prerelease. Without one it can still be forced on
          # when the version carries beta work.
          IS_PRE=false
          [[ "$NEXT" == *-* ]] && IS_PRE=true
          [[ "$FORCE_PRE" == "true" ]] && IS_PRE=true
          [[ "$FORCE_PRE" == "false" && "$NEXT" != *-* ]] && IS_PRE=false

          if [[ "$IS_PRE" == "true" ]]; then
            TITLE="Pre-Release v${NEXT}"
          else
            TITLE="Release v${NEXT}"
          fi

          TAG="v${NEXT}"
          echo "-> $TITLE (tag $TAG, prerelease=$IS_PRE, draft=$DRAFT, dry_run=$DRY_RUN)"

          if [[ "$DRY_RUN" != "true" ]] && git ls-remote --tags origin "refs/tags/${TAG}" | grep -q .; then
            echo "::error::Tag ${TAG} already exists on origin."
            exit 1
          fi

          {
            echo "version=${NEXT}"
            echo "tag=${TAG}"
            echo "title=${TITLE}"
            echo "is_prerelease=${IS_PRE}"
            echo "draft=${DRAFT}"
            echo "dry_run=${DRY_RUN}"
          } >> "$GITHUB_OUTPUT"

      - name: Write package versions
        if: steps.calc.outputs.dry_run != 'true'
        shell: bash
        env:
          NEW_VERSION: ${{ steps.calc.outputs.version }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const version = process.env.NEW_VERSION;
          const files = ['package.json', 'apps/api/package.json', 'apps/web/package.json', 'packages/shared/package.json'];
          for (const file of files) {
            const pkg = JSON.parse(fs.readFileSync(file, 'utf8'));
            pkg.version = version;
            fs.writeFileSync(file, JSON.stringify(pkg, null, 2) + '\n');
            console.log(`${file} -> ${version}`);
          }
          NODE

      - name: Commit, tag and push
        id: commit
        shell: bash
        env:
          DRY_RUN: ${{ steps.calc.outputs.dry_run }}
          NEW_VERSION: ${{ steps.calc.outputs.version }}
          TAG: ${{ steps.calc.outputs.tag }}
        run: |
          set -euo pipefail
          if [[ "$DRY_RUN" == "true" ]]; then
            echo "dry_run: skipping commit, tag and push"
            echo "ref=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json apps/api/package.json apps/web/package.json packages/shared/package.json
          git commit -m "release: v${NEW_VERSION}"

          for attempt in 1 2 3; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then break; fi
            if [[ $attempt -eq 3 ]]; then echo "Branch push failed after 3 attempts" >&2; exit 1; fi
            echo "Push rejected (attempt $attempt/3), rebasing and retrying"
            git pull --rebase origin "${GITHUB_REF_NAME}"
          done

          git tag "$TAG"
          git push origin "$TAG"
          echo "ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Create draft release
        if: steps.calc.outputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.calc.outputs.tag }}
          TITLE: ${{ steps.calc.outputs.title }}
          IS_PRE: ${{ steps.calc.outputs.is_prerelease }}
        run: |
          set -euo pipefail
          ARGS=(--draft --title "$TITLE" --generate-notes)
          [[ "$IS_PRE" == "true" ]] && ARGS+=(--prerelease)
          gh release create "$TAG" "${ARGS[@]}" --repo "$GITHUB_REPOSITORY"
          echo "Draft release created: $TITLE"

  images:
    name: Image (${{ matrix.entry.image }})
    needs: version
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # One version, but images can be pushed separately when only one app changed.
        entry: ${{ fromJSON(needs.version.outputs.apps) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.ref }}

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: needs.version.outputs.dry_run != 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A release tags X.Y.Z, X.Y and latest. A prerelease tags X.Y.Z-suffix and
      # edge, so latest never moves to a beta.
      - name: Compose tags
        id: tags
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
          IS_PRE: ${{ needs.version.outputs.is_prerelease }}
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository_owner }}/coblocks-${{ matrix.entry.image }}
        run: |
          set -euo pipefail
          IMAGE="$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')"
          TAGS="${IMAGE}:${VERSION}"
          if [[ "$IS_PRE" == "true" ]]; then
            TAGS="${TAGS}\n${IMAGE}:edge"
          else
            MINOR="${VERSION%.*}"
            TAGS="${TAGS}\n${IMAGE}:${MINOR}\n${IMAGE}:latest"
          fi
          printf 'tags<<EOF\n%b\nEOF\n' "$TAGS" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.entry.file }}
          target: ${{ matrix.entry.target }}
          push: ${{ needs.version.outputs.dry_run != 'true' }}
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.title=coblocks-${{ matrix.entry.image }}
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
            org.opencontainers.image.revision=${{ needs.version.outputs.ref }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.entry.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.entry.image }}

  finalize:
    name: Finalize release
    needs: [version, images]
    if: ${{ !cancelled() && !failure() && needs.version.outputs.dry_run != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Keep draft or publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
          KEEP_DRAFT: ${{ needs.version.outputs.draft }}
          IS_PRE: ${{ needs.version.outputs.is_prerelease }}
        run: |
          set -euo pipefail
          sleep 5
          ARGS=()
          if [[ "$KEEP_DRAFT" == "true" ]]; then ARGS+=(--draft); else ARGS+=(--draft=false); fi
          if [[ "$IS_PRE" == "true" ]]; then ARGS+=(--prerelease); else ARGS+=(--prerelease=false); fi
          gh release edit "$TAG" "${ARGS[@]}" --repo "$GITHUB_REPOSITORY"
          echo "Release $TAG updated (draft=$KEEP_DRAFT, prerelease=$IS_PRE)"
