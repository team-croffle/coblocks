name: Labeler

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: labeler-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Creates any label from .github/labels.yml that the repository does not have yet.
  # actions/labeler does not create labels, so this runs first.
  sync-labels:
    name: Create missing labels
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      # pull_request_target checks out the base branch, which is also what keeps a
      # fork from getting its own labels.yml executed here.
      - uses: actions/checkout@v4

      - name: Install yq if missing
        run: |
          if ! command -v yq >/dev/null 2>&1; then
            sudo curl -fsSL -o /usr/local/bin/yq \
              https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
            sudo chmod +x /usr/local/bin/yq
          fi
          yq --version

      - name: Apply labels.yml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          yq -o=json '.' .github/labels.yml | jq -c '.[]' | while read -r row; do
            name=$(jq -r '.name' <<<"$row")
            color=$(jq -r '.color' <<<"$row")
            description=$(jq -r '.description // ""' <<<"$row")
            # --force creates the label, or updates its colour and description.
            gh label create "$name" --color "$color" --description "$description" --force
          done

  label:
    name: Apply path labels
    needs: sync-labels
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/labeler@v5
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          configuration-path: .github/labeler.yml
          # Labels whose path rule no longer matches are removed again.
          sync-labels: true
