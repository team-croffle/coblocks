name: Security

# Same trigger shape as CI: pull requests cover branches, `push` covers the default
# branch. `branches: ['**']` ran this twice for every push to a branch with an open
# pull request. The weekly schedule is the backstop for anything never opened as one.
on:
  push:
    branches: [master]
  pull_request:
  schedule:
    # Mondays at 09:00 KST (00:00 UTC)
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # The event name stays in the group: a scheduled run and a push to master share
  # `github.ref`, and they should not cancel each other.
  group: security-${{ github.event_name }}-${{ github.ref }}
  # Never cancel a pull request run: it carries the dependency review, and a
  # cancelled run leaves the check hanging instead of reporting a result.
  cancel-in-progress: ${{ github.event_name != 'pull_request' }}

jobs:
  # Only verified secrets fail the build. Turning on unknown results means every
  # placeholder in .env.example and every development seed password is a finding,
  # and an alarm that always fires is an alarm nobody reads. Exclusions live in
  # .github/trufflehog-exclude.txt, each with the reason it is not a real secret.
  secrets:
    name: TruffleHog secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # A pull request scan needs both sides of the range.
          fetch-depth: 0

      # Pull request: scan only the commits this pull request introduces. Fast, and
      # it does not fail on somebody else's older commit.
      - name: Scan pull request range
        if: github.event_name == 'pull_request'
        uses: trufflesecurity/trufflehog@main
        with:
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}
          extra_args: --results=verified --exclude-paths=.github/trufflehog-exclude.txt

      # Branch push, schedule or manual run: scan the whole working tree.
      - name: Scan working tree
        if: github.event_name != 'pull_request'
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          extra_args: --results=verified --exclude-paths=.github/trufflehog-exclude.txt

  deps:
    name: Dependency review
    # The action only works on pull requests.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          comment-summary-in-pr: on-failure
          fail-on-severity: high
