services:
  db:
    image: postgres:16-alpine
    container_name: coblocks-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: coblocks
      POSTGRES_PASSWORD: coblocks
      POSTGRES_DB: coblocks
    ports:
      - '5432:5432'
    volumes:
      - coblocks-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U coblocks']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  coblocks-pgdata:
